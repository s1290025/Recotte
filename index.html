function validBook(b){return b&&typeof b.id==='string'&&typeof b.title==='string'&&b.title.trim()&&names[b.status]&&['author','note','date','cover'].every(k=>typeof b[k]==='string')&&(!b.date||/^\d{4}-\d{2}-\d{2}$/.test(b.date))}
try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data)||!data.every(validBook))throw Error();books=data}catch{notify('保存した記録を読み込めませんでした。読み込み機能からバックアップを復元できます。')}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));books=next;render();return true}catch{notify('保存できませんでした。ブラウザの保存設定や空き容量をご確認ください。');return false}}
function coverNode(url){
 const candidates=[...new Set((Array.isArray(url)?url:[url]).filter(u=>typeof u==='string'&&/^https:\/\//.test(u)))];
 if(!candidates.length){const p=document.createElement('div');p.className='cover';p.textContent='Recotte!';return p}
 const e=document.createElement('img');e.className='cover';e.alt='表紙';e.loading='lazy';e.referrerPolicy='no-referrer';let index=0;
 const next=()=>{if(index<candidates.length)e.src=candidates[index++];else e.replaceWith(coverNode(''))};
 e.onerror=next;e.onload=()=>{if(e.naturalWidth<=1||e.naturalHeight<=1)next()};next();return e;
}
function coverURLs(b){return [...new Set([b.cover,...(Array.isArray(b.coverCandidates)?b.coverCandidates:[])].filter(u=>typeof u==='string'&&u.startsWith('https://')))]}
function normalizeGoogleBook(entry){
 const v=entry.volumeInfo||{},images=v.imageLinks||{},isbn=(v.industryIdentifiers||[]).find(i=>i.type==='ISBN_13')?.identifier||(v.industryIdentifiers||[]).find(i=>i.type==='ISBN_10')?.identifier||'';
 const candidates=[images.thumbnail,images.smallThumbnail,images.medium,images.small,images.large,images.extraLarge].filter(u=>typeof u==='string').map(u=>u.replace(/^http:/,'https:')).filter(u=>u.startsWith('https://'));
 return {title:v.title||'タイトル不明',author:(v.authors||[]).join('、'),publisher:v.publisher||'',published:v.publishedDate||'',isbn,cover:candidates[0]||'',coverCandidates:[...new Set(candidates)],itemUrl:entry.id?'https://books.google.com/books?id='+encodeURIComponent(entry.id):'',source:'Google Books',volumeId:entry.id||''};
}
function textNode(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
function tagsOf(b){return [...new Set([...(Array.isArray(b.tags)?b.tags.filter(t=>typeof t==='string'):[]),...(b.note.match(/#[^\s#]+/g)||[]).map(t=>t.slice(1))])]}
function renderTags(source){const tags=[...new Set(source.flatMap(tagsOf))].sort((a,b)=>a.localeCompare(b,'ja'));selectedTags=new Set([...selectedTags].filter(t=>tags.includes(t)));$('tag-summary').textContent=selectedTags.size?'ハッシュタグ ('+selectedTags.size+')':'ハッシュタグ';$('tag-options').replaceChildren();if(!tags.length)$('tag-options').append(textNode('p','タグはまだありません。','muted'));for(const tag of tags){const label=textNode('label','','tag-option'),input=document.createElement('input');input.type='checkbox';input.checked=selectedTags.has(tag);input.onchange=()=>{input.checked?selectedTags.add(tag):selectedTags.delete(tag);render()};label.append(input,textNode('span','#'+tag));$('tag-options').append(label)}if(selectedTags.size){const clear=textNode('button','選択をクリア');clear.type='button';clear.onclick=()=>{selectedTags.clear();render()};$('tag-options').append(clear)}}
function tagChips(b){const wrap=textNode('div','','tag-chips');for(const t of tagsOf(b))wrap.append(textNode('span','#'+t));return wrap}
function bookCover(b){const urls=coverURLs(b),e=coverNode(urls);if(!urls.length){e.classList.add('fallback');e.style.setProperty('--book-color',b.color||['#687d8b','#9e7960','#637d69','#8e86a0'][b.title.length%4]);e.replaceChildren(textNode('small','RECOTTE LIBRARY'),textNode('strong',b.title),textNode('small',b.author))}return e}
function selectBook(b){if(b.demo){notify('表示見本の本です。「本を登録」から自分の記録を追加できます。');return}openEditor(b)}
function render(){const demo=!books.length&&showDemo,source=demo?demoBooks:books,counts={wish:0,reading:0,done:0};source.forEach(b=>counts[b.status]++);$('demo-bar').hidden=!!books.length;$('demo-label').textContent=demo?'表示見本 · 本のタイトル・著者・感想は架空です。':'まだ読書記録はありません。';$('demo-toggle').textContent=demo?'見本を非表示':'見本を表示';const container=$('books');container.className=view==='cards'?'grid cards':view;renderTags(source);container.replaceChildren();const q=$('filter').value.trim().toLocaleLowerCase();const visible=source.filter(b=>(filter==='all'||b.status===filter)&&[...selectedTags].every(t=>tagsOf(b).includes(t))&&`${b.title} ${b.author} ${b.note}`.toLocaleLowerCase().includes(q)).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));if(!visible.length){const e=textNode('div','','empty');if(source.length){e.append(textNode('h2','該当する記録がありません'),textNode('p','検索条件や読書状況を変えてみてください。','muted'))}else{const hint=textNode('p','','empty-add-hint'),icon=textNode('button','＋','primary empty-add-icon');icon.type='button';icon.setAttribute('aria-label','本を登録');icon.onclick=()=>$('add').click();hint.append(icon,document.createTextNode('を押して本を記録'));e.append(hint)}container.append(e);return}let shelfRow;
for(const [i,b] of visible.entries()){
if(view==='timeline'){const post=textNode('article','','post'),content=textNode('div','','post-content'),meta=textNode('div','','post-meta');meta.append(textNode('span',b.status==='done'?(b.date||names[b.status]):names[b.status],'muted'));content.append(meta,textNode('p',b.note||'「'+b.title+'」を'+names[b.status]+'に追加しました。','post-note'));const book=textNode('button','','post-book'),info=textNode('div','','info');book.type='button';info.append(textNode('h3',b.title),textNode('div',b.author||'著者未登録','muted'));book.append(bookCover(b),info);book.onclick=()=>selectBook(b);content.append(book,tagChips(b));post.append(content);container.append(post)}
else if(view==='cards'){const card=textNode('button','','card'),art=textNode('div','','card-art'),info=textNode('div','','info');card.type='button';card.setAttribute('aria-label',b.title+'の記録');art.append(bookCover(b));info.append(textNode('span',names[b.status],'badge'),textNode('h3',b.title),textNode('div',b.author||'著者未登録','muted'));if(b.date)info.append(textNode('p',b.date,'muted'));info.append(textNode('p',b.note||'まだ感想はありません。','excerpt'));info.append(tagChips(b));card.append(art,info);card.onclick=()=>selectBook(b);container.append(card)}
else{const columns=window.matchMedia('(max-width:600px)').matches?3:window.matchMedia('(max-width:900px)').matches?4:6;if(i%columns===0){shelfRow=textNode('div','','shelf-row');container.append(shelfRow)}const book=textNode('button','','shelf-book');book.type='button';book.title=b.title+' / '+b.author+' / '+names[b.status];book.setAttribute('aria-label',book.title);book.append(bookCover(b),textNode('span',b.title,'book-title'));book.onclick=()=>selectBook(b);shelfRow.append(book)}}}
function setView(next){view=next;render()}
$('view-select').onchange=e=>setView(e.target.value);
document.addEventListener('click',e=>{if(!$('tag-picker').contains(e.target))$('tag-picker').open=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('tag-picker').open=false});
$('demo-toggle').onclick=()=>{showDemo=!showDemo;render()};for(const query of ['(max-width:600px)','(max-width:900px)'])window.matchMedia(query).addEventListener('change',()=>{if(view==='shelf')render()});
function openEditor(b=null){editing=b?{...b}:{id:crypto.randomUUID(),title:'',author:'',status:'wish',date:'',note:'',cover:''};$('source-book').hidden=!(typeof editing.itemUrl==='string'&&editing.itemUrl.startsWith('https://'));if(!$('source-book').hidden){$('source-book').href=editing.itemUrl;$('source-book').textContent=editing.source==='Google Books'?'Google Booksで見る':'書籍情報を見る'}for(const k of ['title','author','status','date','note'])$(k).value=editing[k];$('tags').value=tagsOf(editing).map(t=>'#'+t).join(' ');$('delete').classList.toggle('hidden',!books.some(x=>x.id===editing.id));$('edittitle').textContent=books.some(x=>x.id===editing.id)?'本の記録を編集':'本の記録';$('searchdialog').close();$('editdialog').showModal()}
$('add').onclick=()=>{$('searchdialog').showModal();$('query').focus()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('manual').onclick=()=>openEditor();$('filter').oninput=render;
$('toggle-search').onclick=()=>{const input=$('filter'),open=input.hidden;input.hidden=!open;$('toggle-search').setAttribute('aria-expanded',String(open));if(open)input.focus();else{input.value='';render()}};
$('filter').addEventListener('keydown',e=>{if(e.key==='Escape'){$('toggle-search').click();$('toggle-search').focus()}});
$('tabs').onclick=e=>{const b=e.target.closest('[data-status]');if(!b)return;filter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()};
$('editform').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').setCustomValidity('タイトルを入力してください。');$('title').reportValidity();return}const b={...editing,title,author:$('author').value.trim(),status:$('status').value,date:$('date').value,note:$('note').value.trim(),tags:[...new Set($('tags').value.split(/[\s,、]+/).map(t=>t.replace(/^#+/,'')).filter(Boolean))],updatedAt:new Date().toISOString()};if(persist([...books.filter(x=>x.id!==b.id),b])){$('editdialog').close();notify('記録を保存しました。')}};$('title').oninput=()=>$('title').setCustomValidity('');
$('delete').onclick=()=>{if(confirm(`「${editing.title}」の記録を削除しますか？`)&&persist(books.filter(b=>b.id!==editing.id))){$('editdialog').close();notify('記録を削除しました。')}};



const GOOGLE_SETTINGS_KEY='recotte.googlebooks.v1',bookSearchCache=new Map();
let lastBookSearchAt=0;
function getGoogleAPIKey(){try{return String(JSON.parse(localStorage.getItem(GOOGLE_SETTINGS_KEY)||'{}')?.apiKey||'').trim()}catch{return ''}}
function refreshGoogleSettings(){
 const apiKey=getGoogleAPIKey();$('google-api-key').value=apiKey;$('google-settings').open=!apiKey;$('searchmessage').textContent=apiKey?'Google Booksで本を検索できます。':'検索設定でGoogle Books APIキーを設定してください。';
}
$('google-settings-form').onsubmit=e=>{
 e.preventDefault();const apiKey=$('google-api-key').value.trim();if(!apiKey)return;
 try{localStorage.setItem(GOOGLE_SETTINGS_KEY,JSON.stringify({apiKey}));bookSearchCache.clear();refreshGoogleSettings();$('google-settings-status').textContent='保存しました。';$('query').focus()}catch{$('google-settings-status').textContent='設定を保存できませんでした。'}
};
$('google-settings-clear').onclick=()=>{try{localStorage.removeItem(GOOGLE_SETTINGS_KEY);bookSearchCache.clear();refreshGoogleSettings();$('google-settings-status').textContent='このブラウザの設定を削除しました。'}catch{$('google-settings-status').textContent='設定を削除できませんでした。'}};
async function requestBookJSON(url,parentSignal,apiKey){
 const controller=new AbortController(),abort=()=>controller.abort();parentSignal.addEventListener('abort',abort,{once:true});if(parentSignal.aborted)controller.abort();const timeout=setTimeout(abort,12000);
 try{
 const response=await fetch(url,{signal:controller.signal,headers:{'X-Goog-Api-Key':apiKey}});
 let data;try{data=await response.json()}catch{if(response.ok)throw new Error('検索結果を読み込めませんでした。')}
 if(!response.ok||data?.error){
  const reasons=(data?.error?.errors||[]).map(x=>x.reason),details=JSON.stringify(data?.error?.details||[]);
  if(response.status===429||reasons.some(x=>/quota|limit/i.test(x))||/QUOTA_EXCEEDED|RATE_LIMIT_EXCEEDED/.test(details))throw new Error('Google Booksの利用上限に達しました。Google Cloudの割り当てを確認し、時間をおいてお試しください。');
  if(reasons.includes('accessNotConfigured')||details.includes('SERVICE_DISABLED'))throw new Error('Google CloudでBooks APIを有効にしてください。');
  if(response.status===401||response.status===403||details.includes('API_KEY_INVALID')||reasons.includes('keyInvalid'))throw new Error('APIキーと、Google CloudのBooks API・許可するウェブサイトの設定を確認してください。');
  if(response.status===400)throw new Error('APIキーまたは検索条件を確認してください。');
  throw new Error('Google Booksから情報を取得できませんでした。もう一度お試しください。');
 }
 return data;
 }catch(error){if(parentSignal.aborted)throw error;if(controller.signal.aborted)throw new Error('検索に時間がかかっています。もう一度お試しください。');if(error instanceof TypeError)throw new Error('Google Booksに接続できません。通信状況を確認してください。');throw error}
 finally{clearTimeout(timeout);parentSignal.removeEventListener('abort',abort)}
}
function googleSearchURL(q,type){
 const value=q.normalize('NFKC').trim(),digits=value.replace(/[-\s]/g,''),isISBN=/^(?:\d{9}[\dXx]|\d{13})$/.test(digits),field=isISBN?'isbn':type;
 if(!['title','author','isbn'].includes(field))throw new Error('検索項目を選択してください。');
 if(field==='isbn'&&!isISBN)throw new Error('ISBNは10桁または13桁で入力してください。');
 const query=field==='isbn'?'isbn:'+digits:(field==='author'?'inauthor:':'intitle:')+value;
 return 'https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(query)+'&maxResults=20&printType=books&orderBy=relevance';
}
async function searchBookCatalog(q,signal){
 const apiKey=getGoogleAPIKey();if(!apiKey){$('google-settings').open=true;throw new Error('検索設定でGoogle Books APIキーを設定してください。')}
 const type=$('book-search-type').value,key=type+':'+q.normalize('NFKC').trim(),cached=bookSearchCache.get(key);
 if(cached&&Date.now()-cached.time<600000)return cached.result;
 const data=await requestBookJSON(googleSearchURL(q,type),signal,apiKey);
 if(data.items!==undefined&&!Array.isArray(data.items))throw new Error('Google Booksの検索結果を読み込めませんでした。');
 const items=(data.items||[]).map(normalizeGoogleBook),result={items,source:'Google Books'};
 bookSearchCache.set(key,{time:Date.now(),result});return result;
}
refreshGoogleSettings();
$('searchform').onsubmit=async e=>{
 e.preventDefault();const q=$('query').value.trim();if(!q||$('searchbutton').disabled)return;
 if(Date.now()-lastBookSearchAt<1100){$('searchmessage').textContent='少し間をあけて検索してください。';return}
 lastBookSearchAt=Date.now();searchController?.abort();const controller=new AbortController();searchController=controller;
 $('searchbutton').disabled=true;$('results').replaceChildren();$('searchmessage').textContent='検索しています…';
 try{
  const {items,source}=await searchBookCatalog(q,controller.signal);if(controller.signal.aborted)return;
  $('searchmessage').textContent=items.length?(source+' · 本を選ぶと登録できます。'):'見つかりませんでした。別のキーワードや手動登録をお試しください。';
  for(const v of items){const b={id:crypto.randomUUID(),title:v.title,author:v.author,status:'wish',date:'',note:'',cover:v.cover,coverCandidates:v.coverCandidates,isbn:v.isbn,itemUrl:v.itemUrl,source:v.source,volumeId:v.volumeId};
   const button=textNode('button','','result');button.type='button';const info=textNode('span','');info.append(textNode('strong',b.title),textNode('div',[b.author,v.publisher,v.published].filter(Boolean).join(' / '),'muted'));
   button.append(coverNode(coverURLs(b)),info);button.onclick=()=>openEditor(b);$('results').append(button)
  }
 }catch(error){if(!controller.signal.aborted)$('searchmessage').textContent=error.message||'検索できませんでした。もう一度お試しください。'}
 finally{if(searchController===controller)$('searchbutton').disabled=false}
};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,books},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='recotte-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('importfile').click();$('importfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error();const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.books)||!data.books.every(validBook))throw Error();const incoming=new Map(data.books.map(b=>[b.id,b]));const collisions=books.some(b=>incoming.has(b.id));if(collisions&&!confirm('同じ記録はバックアップの内容で上書きします。読み込みますか？'))return;if(persist([...books.filter(b=>!incoming.has(b.id)),...incoming.values()]))notify('バックアップを読み込みました。')}catch{notify('読み込めませんでした。Recotte! のバックアップJSONを選んでください。')}finally{e.target.value=''}};
render();
