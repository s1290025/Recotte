<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#526b50"><title>Recotte! | レコッテ！</title>
<style>
*{box-sizing:border-box}
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:#333b34;background:#fafaf8;font-size:14px}
body{margin:0;background:#fafaf8}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 17px;background:#edf0e9;color:#566451}button:hover{filter:brightness(.97)}button:disabled{opacity:.55;cursor:wait}button:focus-visible,summary:focus-visible{outline:3px solid #799883;outline-offset:4px}
.primary{background:#44624e;color:#fff}.primary:hover{filter:brightness(.94)}
header{background:transparent}header>div{max-width:1080px;margin:auto;padding:32px 30px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:20px;font-weight:600;letter-spacing:.03em}.brand small{display:none}header .primary{width:40px;height:40px;padding:0;border-radius:12px;font-size:28px;font-weight:300;display:grid;place-items:center}
main{max-width:1080px;margin:auto;padding:0 30px 50px}
.toolbar,.tabs,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar{gap:14px;margin:0 0 26px;padding:10px 0}
.toolbar #view-select{width:auto;cursor:pointer;border:1px solid #d8dfd4;border-radius:20px;background:#edf0e9;color:#566451;padding:7px 10px;font-size:13px}
.tabs{gap:6px}.tabs button{background:transparent;color:#788078;border:1px solid transparent;padding:7px 12px;font-size:13px;border-radius:20px}
.tabs button.active{background:#44624e;color:white;border-color:#44624e}.tabs button:hover{background:#edf0e9;color:#566451}.tabs button.active:hover{background:#44624e;color:white}
.toolbar #filter{margin-left:auto;width:172px;padding:8px 11px;font-size:13px;background:transparent}
input,select,textarea{border:1px solid #dfe4dc;border-radius:8px;padding:12px;background:#fff;max-width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #91ac97;outline-offset:1px}
.muted{font-size:12px;color:#889084;line-height:1.7}p{line-height:1.8}h2{font-size:18px;font-weight:600;margin:0}
.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-8px 0 24px;font-size:11px;color:#929990}
.demo-bar[hidden]{display:none}.demo-bar button{font-size:11px;background:transparent;color:#889084;padding:4px 0}
.grid.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:30px 22px;align-items:start}
.cards .card{min-width:0;border:0;border-radius:0;background:transparent;padding:0;text-align:left;display:block;width:100%}
.cards .card:hover{filter:none}.card-art{aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#e9eee7;display:grid;place-items:center;position:relative;border:1px solid #00000006;padding:18px}
.cards .card:nth-child(4n+2) .card-art{background:#f0ece3}.cards .card:nth-child(4n+3) .card-art{background:#e7edf0}.cards .card:nth-child(4n) .card-art{background:#ede8ed}
.card-art .cover{height:115px;width:78px;box-shadow:2px 3px 7px #29382918}
.cards .info{padding:0 2px}.cards .info h3{font-size:14px;font-weight:500;margin:11px 0 4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cards .info>.badge{display:none}.cards .info>.muted{font-size:11px;margin:0}.cards .info>p.muted{display:none}
.excerpt{font-size:12px;color:#889084;line-height:1.7;margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.tag-chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0}.tag-chips:empty{display:none}.tag-chips span{font-size:11px;color:#566451;background:#edf0e9;padding:3px 8px;border-radius:12px;overflow-wrap:anywhere}
.cover{height:115px;width:80px;object-fit:contain;flex-shrink:0;border-radius:2px}
.cover.fallback{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 7px;border-left:4px solid #ffffff20;background:var(--book-color,#687965);color:#fff;text-align:center;overflow:hidden}
.cover.fallback strong{font-family:inherit;font-size:11px;font-weight:500;line-height:1.6;overflow-wrap:anywhere}.cover.fallback small{font-size:7px;opacity:.8}
.timeline{max-width:660px;margin:auto}
.post{display:flex;gap:13px;padding:24px 0;border-bottom:1px solid #e2e7de}.post:first-child{padding-top:0}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;flex-shrink:0;background:#e9eee7;color:#58735e;font-size:16px}
.post-content{flex:1;min-width:0}.post-meta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.post-meta strong{font-size:13px;font-weight:500}.post-meta .muted{font-size:11px}
.post-note{font-size:14px;line-height:1.9;margin:10px 0 15px;white-space:pre-wrap;overflow-wrap:anywhere}
.post-book{display:flex;width:100%;gap:14px;align-items:center;text-align:left;padding:13px;background:#fff;border:1px solid #e2e5df;border-radius:12px}.post-book .cover{width:46px;height:67px}.post-book .info{min-width:0}.post-book h3{font-size:13px;font-weight:500;margin:0 0 5px;overflow-wrap:anywhere}.post-status{font-size:11px;color:#929990;margin:12px 0 0}
.shelf{background:#f0eee7;padding:8px 24px 0;border-radius:12px;border:1px solid #e6e2d9}
.shelf-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:26px;padding:30px 12px 0;border-bottom:10px solid #d4c6ae;margin-bottom:42px;box-shadow:0 5px 6px -4px #67594433}
.shelf-book{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:transparent;padding:0;min-width:0;border-radius:0}.shelf-book .cover{height:145px;width:100%;max-width:101px;box-shadow:2px 2px 5px #0002}.shelf-book .book-title{position:absolute;bottom:-31px;font-size:10px;color:#8a8172;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-picker{position:relative}.tag-picker summary{cursor:pointer;border:1px solid #d8dfd4;border-radius:20px;background:#edf0e9;color:#566451;font-size:13px;padding:7px 11px}
#tag-options{position:absolute;top:calc(100% + 7px);left:0;min-width:205px;max-height:260px;overflow:auto;background:#fff;border:1px solid #dfe4dc;border-radius:10px;padding:6px;box-shadow:0 5px 18px #0001;z-index:5}
.tag-option{display:flex;align-items:center;gap:9px;cursor:pointer;margin:0;padding:9px 10px;font-size:13px}.tag-option:hover{background:#edf0e9;border-radius:6px}.tag-option input{width:16px;height:16px;accent-color:#44624e}#tag-options>button{width:100%;font-size:12px;margin-top:6px;padding:8px}
footer{max-width:1080px;margin:auto;padding:0 30px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}footer .muted{font-size:11px}footer button{background:transparent;color:#889084;font-size:12px;padding:6px 8px}
dialog{border:1px solid #e2e5df;border-radius:17px;padding:26px;width:min(540px,calc(100% - 36px));max-height:88dvh;overflow:auto;color:#333b34;background:#fff;box-shadow:0 18px 75px #0002}dialog::backdrop{background:#25312a55}
.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.dialoghead button{background:transparent;font-size:22px;color:#788078;padding:0 6px}
label{display:block;font-size:13px;margin:15px 0 7px}.field,textarea{width:100%}textarea{resize:vertical;min-height:120px}
.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:23px}.danger{background:transparent;color:#a46050;margin-right:auto;padding-left:0}
.results{max-height:350px;overflow:auto;margin:14px 0}.result{display:flex;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid #e2e5df;margin-bottom:8px}.result .cover{width:40px;height:60px}.result span{min-width:0}.result strong{font-size:13px;font-weight:500}
.separator{font-size:12px;color:#889084;text-align:center;margin:24px 0 12px}
.empty{grid-column:1/-1;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#929990;text-align:center;padding:25px}.empty h2{font-size:16px;font-weight:500}.empty p{font-size:12px}.message{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 36px);width:max-content;background:#334738;color:white;padding:12px 18px;font-size:13px;border-radius:10px;box-shadow:0 4px 20px #0001;z-index:8}.message:empty,.hidden{display:none!important}
@media(max-width:900px){.toolbar{gap:9px}.toolbar #filter{width:145px}.tabs{gap:0}.tabs button{padding:7px 9px}}
@media(max-width:600px){header>div{padding:25px 18px 18px}.brand{font-size:18px}header .primary{width:36px;height:36px}main{padding:0 18px 35px}.toolbar{gap:6px;margin-bottom:23px;padding:4px 0}.toolbar #view-select{font-size:12px;padding:7px 5px;max-width:105px}.tabs button{font-size:12px;padding:7px 6px}.tag-picker summary{font-size:12px;padding:7px}.toolbar #filter{width:100%;margin:9px 0 0;padding:10px 12px}.demo-bar{font-size:10px;margin:0 0 20px}.demo-bar span{max-width:75%}.demo-bar button{font-size:10px;white-space:nowrap}.grid.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 15px}.card-art{border-radius:10px;padding:14px}.card-art .cover{height:94px;width:64px}.cards .info h3{font-size:13px}.cards .excerpt{font-size:11px}.post{gap:10px;padding:22px 0}.avatar{width:30px;height:30px;font-size:14px}.post-note{font-size:13px}.shelf{padding:5px 12px 0}.shelf-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:25px 7px 0}.shelf-book .cover{height:132px;max-width:92px}#tag-options{left:auto;right:0;max-width:calc(100vw - 36px)}footer{padding:0 18px 24px}footer .muted{font-size:10px}.row{flex-direction:column;gap:0}}
</style></head>
<body><header><div><div class="brand">Recotte! <small>レコッテ！</small></div><button class="primary" id="add" aria-label="本を登録" title="本を登録">＋</button></div></header>
<main><div class="toolbar"><select id="view-select" aria-label="表示形式"><option value="timeline">タイムライン</option><option value="cards">カード</option><option value="shelf">本棚</option></select><div class="tabs" id="tabs"><button data-status="all" class="active">すべて</button><button data-status="wish">読みたい</button><button data-status="reading">読書中</button><button data-status="done">読了</button></div><details class="tag-picker" id="tag-picker"><summary id="tag-summary">ハッシュタグ</summary><div id="tag-options"></div></details><input id="filter" type="search" placeholder="記録した本を検索" aria-label="記録した本を検索"></div><div class="demo-bar" id="demo-bar"><span id="demo-label"></span><button id="demo-toggle" type="button"></button></div><div id="books" class="timeline" role="tabpanel" aria-label="読書記録"></div></main>
<footer><span class="muted">記録はこのブラウザに保存されます。定期的にバックアップしてください。</span><div class="actions"><button id="export">書き出し</button><button id="import">読み込み</button><input id="importfile" type="file" accept="application/json,.json" hidden></div></footer>
<dialog id="searchdialog"><div class="dialoghead"><h2>本を登録</h2><button type="button" data-close aria-label="閉じる">×</button></div><form id="searchform"><label for="query">タイトル・著者名・ISBNで検索</label><div class="actions"><input id="query" style="flex:1;min-width:120px" required placeholder="本のタイトルなど"><button class="primary" id="searchbutton">検索</button></div></form><p class="muted" id="searchmessage" role="status">Google Booksから本の情報を探します。</p><div id="results" class="results"></div><div class="separator">見つからない本はこちらから</div><button id="manual" style="width:100%">手動で登録する</button></dialog>
<dialog id="editdialog"><div class="dialoghead"><h2 id="edittitle">本の記録</h2><button type="button" data-close aria-label="閉じる">×</button></div><form id="editform"><label for="title">タイトル（必須）</label><input class="field" id="title" required maxlength="300"><label for="author">著者</label><input class="field" id="author" maxlength="300"><div class="row"><div><label for="status">読書状況</label><select class="field" id="status"><option value="wish">読みたい</option><option value="reading">読書中</option><option value="done">読了</option></select></div><div><label for="date">読了日</label><input class="field" id="date" type="date"></div></div><label for="tags">ハッシュタグ</label><input class="field" id="tags" placeholder="#小説 #お気に入り" maxlength="500"><label for="note">感想・メモ</label><textarea id="note" placeholder="心に残ったことを、自由に。" maxlength="20000"></textarea><div class="formactions"><button class="danger" id="delete" type="button">削除</button><button type="button" data-close>キャンセル</button><button class="primary">保存する</button></div></form></dialog><div class="message" id="message" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='recotte.books.v1',names={wish:'読みたい',reading:'読書中',done:'読了'};
let books=[],filter='all',editing=null,searchController=null,view='timeline',showDemo=true,selectedTags=new Set();
const demoBooks=[
{title:'星を編む',author:'朝の文庫',status:'done',date:'2026-10-20',note:'最後のページを閉じてからも、登場人物の暮らしが続いているような気がした。静かな場面ほど心に残る。',color:'#687d8b'},
{title:'喫茶と雨の日',author:'三月しおり',status:'reading',date:'',note:'雨の音を聞きながら、少しずつ読み進めています。',color:'#9e7960'},
{title:'遠い街の手紙',author:'青井はる',status:'wish',date:'',note:'旅に持っていきたい一冊。',color:'#a18b59'},
{title:'森の向こうへ',author:'小野なつめ',status:'done',date:'2026-10-16',note:'いつもの道も、少し違って見えるようになった。',color:'#637d69'},
{title:'夜明けの台所',author:'水野あかり',status:'done',date:'2026-10-12',note:'料理の描写が好き。温かいスープを作りたくなる。',color:'#b07d73'},
{title:'余白のある日々',author:'日々出版',status:'wish',date:'',note:'',color:'#8e86a0'},
{title:'海辺のノート',author:'夏川みお',status:'done',date:'2026-10-08',note:'海の匂いまで伝わってくるような文章でした。',color:'#679497'},
{title:'小さな旅の途中',author:'山路ふみ',status:'reading',date:'',note:'週末に一章ずつ。',color:'#b39a74'},
{title:'月と図書室',author:'白石ゆう',status:'wish',date:'',note:'',color:'#636d8c'}
].map((b,i)=>({...b,tags:i%3===0?['小説','お気に入り']:i%3===1?['小説','日々']:['エッセイ'],id:'demo-'+i,cover:'',demo:true,updatedAt:'2026-10-'+String(21-i).padStart(2,'0')}));
function notify(s){$('message').textContent=s;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('message').textContent='',5000)}
function validBook(b){return b&&typeof b.id==='string'&&typeof b.title==='string'&&b.title.trim()&&names[b.status]&&['author','note','date','cover'].every(k=>typeof b[k]==='string')&&(!b.date||/^\d{4}-\d{2}-\d{2}$/.test(b.date))}
try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data)||!data.every(validBook))throw Error();books=data}catch{notify('保存した記録を読み込めませんでした。読み込み機能からバックアップを復元できます。')}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));books=next;render();return true}catch{notify('保存できませんでした。ブラウザの保存設定や空き容量をご確認ください。');return false}}
function coverNode(url){const e=document.createElement('img');e.className='cover';e.alt='表紙';if(/^https:\/\//.test(url)){e.src=url;e.loading='lazy';e.referrerPolicy='no-referrer';e.onerror=()=>{e.replaceWith(coverNode(''))}}else{const p=document.createElement('div');p.className='cover';p.textContent='Recotte!';return p}return e}
function textNode(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
function tagsOf(b){return [...new Set([...(Array.isArray(b.tags)?b.tags.filter(t=>typeof t==='string'):[]),...(b.note.match(/#[^\s#]+/g)||[]).map(t=>t.slice(1))])]}
function renderTags(source){const tags=[...new Set(source.flatMap(tagsOf))].sort((a,b)=>a.localeCompare(b,'ja'));selectedTags=new Set([...selectedTags].filter(t=>tags.includes(t)));$('tag-summary').textContent=selectedTags.size?'ハッシュタグ ('+selectedTags.size+')':'ハッシュタグ';$('tag-options').replaceChildren();if(!tags.length)$('tag-options').append(textNode('p','タグはまだありません。','muted'));for(const tag of tags){const label=textNode('label','','tag-option'),input=document.createElement('input');input.type='checkbox';input.checked=selectedTags.has(tag);input.onchange=()=>{input.checked?selectedTags.add(tag):selectedTags.delete(tag);render()};label.append(input,textNode('span','#'+tag));$('tag-options').append(label)}if(selectedTags.size){const clear=textNode('button','選択をクリア');clear.type='button';clear.onclick=()=>{selectedTags.clear();render()};$('tag-options').append(clear)}}
function tagChips(b){const wrap=textNode('div','','tag-chips');for(const t of tagsOf(b))wrap.append(textNode('span','#'+t));return wrap}
function bookCover(b){const e=coverNode(b.cover);if(!b.cover){e.classList.add('fallback');e.style.setProperty('--book-color',b.color||['#687d8b','#9e7960','#637d69','#8e86a0'][b.title.length%4]);e.replaceChildren(textNode('small','RECOTTE LIBRARY'),textNode('strong',b.title),textNode('small',b.author))}return e}
function selectBook(b){if(b.demo){notify('表示見本の本です。「本を登録」から自分の記録を追加できます。');return}openEditor(b)}
function render(){const demo=!books.length&&showDemo,source=demo?demoBooks:books,counts={wish:0,reading:0,done:0};source.forEach(b=>counts[b.status]++);$('demo-bar').hidden=!!books.length;$('demo-label').textContent=demo?'表示見本 · 本のタイトル・著者・感想は架空です。':'まだ読書記録はありません。';$('demo-toggle').textContent=demo?'見本を非表示':'見本を表示';const container=$('books');container.className=view==='cards'?'grid cards':view;renderTags(source);container.replaceChildren();const q=$('filter').value.trim().toLocaleLowerCase();const visible=source.filter(b=>(filter==='all'||b.status===filter)&&[...selectedTags].every(t=>tagsOf(b).includes(t))&&`${b.title} ${b.author} ${b.note}`.toLocaleLowerCase().includes(q)).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));if(!visible.length){const e=textNode('div','','empty');e.append(textNode('h2',source.length?'該当する記録がありません':'最初の1冊を、記録しましょう。'),textNode('p',source.length?'検索条件や読書状況を変えてみてください。':'読みたい本も、読み終えた本も。自分だけの読書記録を。','muted'));container.append(e);return}let shelfRow;
for(const [i,b] of visible.entries()){
if(view==='timeline'){const post=textNode('article','','post'),content=textNode('div','','post-content'),meta=textNode('div','','post-meta');meta.append(textNode('strong','わたし'),textNode('span',b.date||'読書メモ','muted'));content.append(meta,textNode('p',b.note||'「'+b.title+'」を'+names[b.status]+'に追加しました。','post-note'));const book=textNode('button','','post-book'),info=textNode('div','','info');book.type='button';info.append(textNode('h3',b.title),textNode('div',b.author||'著者未登録','muted'));book.append(bookCover(b),info);book.onclick=()=>selectBook(b);content.append(book,tagChips(b),textNode('div',names[b.status],'post-status'));post.append(textNode('div','R','avatar'),content);container.append(post)}
else if(view==='cards'){const card=textNode('button','','card'),art=textNode('div','','card-art'),info=textNode('div','','info');card.type='button';card.setAttribute('aria-label',b.title+'の記録');art.append(bookCover(b));info.append(textNode('span',names[b.status],'badge'),textNode('h3',b.title),textNode('div',b.author||'著者未登録','muted'));if(b.date)info.append(textNode('p',b.date,'muted'));info.append(textNode('p',b.note||'まだ感想はありません。','excerpt'));info.append(tagChips(b));card.append(art,info);card.onclick=()=>selectBook(b);container.append(card)}
else{const columns=window.matchMedia('(max-width:600px)').matches?3:6;if(i%columns===0){shelfRow=textNode('div','','shelf-row');container.append(shelfRow)}const book=textNode('button','','shelf-book');book.type='button';book.title=b.title+' / '+b.author+' / '+names[b.status];book.setAttribute('aria-label',book.title);book.append(bookCover(b),textNode('span',b.title,'book-title'));book.onclick=()=>selectBook(b);shelfRow.append(book)}}}
function setView(next){view=next;render()}
$('view-select').onchange=e=>setView(e.target.value);
document.addEventListener('click',e=>{if(!$('tag-picker').contains(e.target))$('tag-picker').open=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('tag-picker').open=false});
$('demo-toggle').onclick=()=>{showDemo=!showDemo;render()};window.matchMedia('(max-width:600px)').addEventListener('change',()=>{if(view==='shelf')render()});
function openEditor(b=null){editing=b?{...b}:{id:crypto.randomUUID(),title:'',author:'',status:'wish',date:'',note:'',cover:''};for(const k of ['title','author','status','date','note'])$(k).value=editing[k];$('tags').value=tagsOf(editing).map(t=>'#'+t).join(' ');$('delete').classList.toggle('hidden',!books.some(x=>x.id===editing.id));$('edittitle').textContent=books.some(x=>x.id===editing.id)?'本の記録を編集':'本の記録';$('searchdialog').close();$('editdialog').showModal()}
$('add').onclick=()=>$('searchdialog').showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('manual').onclick=()=>openEditor();$('filter').oninput=render;
$('tabs').onclick=e=>{const b=e.target.closest('[data-status]');if(!b)return;filter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()};
$('editform').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').setCustomValidity('タイトルを入力してください。');$('title').reportValidity();return}const b={...editing,title,author:$('author').value.trim(),status:$('status').value,date:$('date').value,note:$('note').value.trim(),tags:[...new Set($('tags').value.split(/[\s,、]+/).map(t=>t.replace(/^#+/,'')).filter(Boolean))],updatedAt:new Date().toISOString()};if(persist([...books.filter(x=>x.id!==b.id),b])){$('editdialog').close();notify('記録を保存しました。')}};$('title').oninput=()=>$('title').setCustomValidity('');
$('delete').onclick=()=>{if(confirm(`「${editing.title}」の記録を削除しますか？`)&&persist(books.filter(b=>b.id!==editing.id))){$('editdialog').close();notify('記録を削除しました。')}};
$('searchform').onsubmit=async e=>{e.preventDefault();const q=$('query').value.trim();if(!q)return;searchController?.abort();const controller=new AbortController();searchController=controller;const timeout=setTimeout(()=>controller.abort(),15000);$('searchbutton').disabled=true;$('results').replaceChildren();$('searchmessage').textContent='検索しています…';try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=20&printType=books&langRestrict=ja',{signal:controller.signal});if(!r.ok)throw Error();const data=await r.json();const items=data.items||[];$('searchmessage').textContent=items.length?'本を選ぶと記録を入力できます。':'見つかりませんでした。別のキーワードや手動登録をお試しください。';for(const item of items){const v=item.volumeInfo||{},b={id:crypto.randomUUID(),title:v.title||'タイトル不明',author:(v.authors||[]).join('、'),status:'wish',date:'',note:'',cover:(v.imageLinks?.thumbnail||'').replace(/^http:/,'https:')};const button=textNode('button','','result');button.type='button';const info=textNode('span','');info.append(textNode('strong',b.title),textNode('div',[b.author,v.publisher,v.publishedDate].filter(Boolean).join(' / '),'muted'));button.append(coverNode(b.cover),info);button.onclick=()=>openEditor(b);$('results').append(button)}}catch{$('searchmessage').textContent='検索できませんでした。通信状況を確認するか、手動で登録してください。'}finally{clearTimeout(timeout);$('searchbutton').disabled=false}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,books},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='recotte-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('importfile').click();$('importfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error();const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.books)||!data.books.every(validBook))throw Error();const incoming=new Map(data.books.map(b=>[b.id,b]));const collisions=books.some(b=>incoming.has(b.id));if(collisions&&!confirm('同じ記録はバックアップの内容で上書きします。読み込みますか？'))return;if(persist([...books.filter(b=>!incoming.has(b.id)),...incoming.values()]))notify('バックアップを読み込みました。')}catch{notify('読み込めませんでした。Recotte! のバックアップJSONを選んでください。')}finally{e.target.value=''}};
render();
</script></body></html>
