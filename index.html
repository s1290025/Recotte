<style>

:0}footer{margin-top:24px;padding:20px}.cover{width:72px;height:105px}}

.view-tabs{display:flex;border-bottom:1px solid #dce2d7;gap:28px;margin-top:30px}.view-tabs button{position:relative;border:0;border-radius:0;background:transparent;padding:16px 4px;color:#7b8477;font-weight:600}.view-tabs button[aria-selected="true"]{color:#354f33}.view-tabs button[aria-selected="true"]:after{content:"";position:absolute;bottom:-1px;height:3px;border-radius:3px;background:#526b50;left:0;right:0}.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;color:#74806e;font-size:12px}.demo-bar button{font-size:12px;padding:6px 12px}.grid.cards{gap:18px}.cards .card{display:block;padding:0;overflow:hidden;min-height:0;transition:transform .15s,box-shadow .15s}.cards .card:hover{transform:translateY(-3px);box-shadow:0 8px 24px #273d2910;background:white}.card-art{height:190px;background:#eeeee6;display:flex;justify-content:center;align-items:center;padding:22px}.card-art .cover{width:94px;height:140px;box-shadow:3px 4px 8px #0002}.cards .info{padding:18px}.cards .info h3{margin:12px 0 4px}.cards .excerpt{min-height:38px;margin-bottom:0}.timeline{display:block;max-width:720px;margin:auto;background:white;border:1px solid #e0e5db;border-radius:14px;overflow:hidden}.post{display:flex;gap:13px;padding:24px;border-bottom:1px solid #e7eae3}.post:last-child{border-bottom:0}.avatar{height:38px;width:38px;flex-shrink:0;border-radius:50%;background:#dfe7d8;color:#526b50;display:grid;place-items:center;font-family:serif;font-size:20px}.post-content{min-width:0;flex:1}.post-meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}.post-meta strong{font-size:14px}.post-note{font-size:14px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 16px}.post-book{display:flex;gap:14px;border:1px solid #e0e5da;border-radius:10px;padding:13px;text-align:left;width:100%;background:#fafbf8}.post-book .cover{width:50px;height:74px}.post-book h3{font-size:14px;margin:3px 0 7px}.post-status{font-size:12px;color:#71806a;margin-top:12px}.shelf{display:block;background:#ede5d6;border:1px solid #ded4c1;border-radius:12px;overflow:hidden;padding:12px 24px 0}.shelf-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px;padding:28px 14px 0;border-bottom:13px solid #c4a67d;box-shadow:0 6px 8px -4px #7e5a3d55;margin-bottom:22px;position:relative}.shelf-book{border:0;border-radius:0;background:transparent;padding:0 0 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}.shelf-book:hover{background:transparent}.shelf-book .cover{height:148px;width:100%;max-width:104px;object-fit:fill;box-shadow:3px 2px 5px #382a2533;border-radius:2px 4px 2px 1px;transition:transform .15s}.shelf-book:hover .cover{transform:translateY(-5px)}.shelf-book .book-title{font-size:10px;max-width:105px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:absolute;bottom:-34px;color:#685b4a;z-index:1}.shelf-row{margin-bottom:42px}.cover.fallback{background:var(--book-color,#687965);color:#fff;padding:12px 9px;border-left:5px solid #ffffff23;flex-direction:column;justify-content:space-between;text-align:center;overflow:hidden}.cover.fallback strong{font-family:serif;font-size:12px;line-height:1.8;overflow-wrap:anywhere}.cover.fallback small{font-size:8px;opacity:.8}.shelf .empty{margin:15px 0 25px}.timeline .empty{border:0}.view-label{font-size:12px;letter-spacing:.1em;color:#7d8676}
@media(max-width:600px){.view-tabs{justify-content:space-between;gap:0}.view-tabs button{font-size:14px;padding:15px 6px}.grid.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card-art{height:153px;padding:16px}.card-art .cover{width:78px;height:118px}.cards .info{padding:13px}.cards .info h3{font-size:14px}.cards .info .muted{font-size:11px}.cards .excerpt{font-size:11px}.post{padding:18px 14px;gap:10px}.avatar{width:30px;height:30px;font-size:16px}.shelf{padding:8px 12px 0}.shelf-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:24px 8px 0}.shelf-book .cover{height:132px;max-width:92px}.demo-bar{align-items:flex-start}.demo-bar span{max-width:65%}}

<body><header><div><div class="brand">Recotte! <small>レコッテ！</small></div><button class="primary" id="add">＋ 本を登録</button></div></header>
<main><nav class="view-tabs" role="tablist" aria-label="記録の表示形式"><button id="view-timeline" role="tab" aria-selected="true" aria-controls="books" data-view="timeline">タイムライン</button><button id="view-cards" role="tab" aria-selected="false" aria-controls="books" data-view="cards" tabindex="-1">カード</button><button id="view-shelf" role="tab" aria-selected="false" aria-controls="books" data-view="shelf" tabindex="-1">本棚</button></nav><div class="toolbar"><div class="tabs" id="tabs"><button data-status="all" class="active">すべて</button><button data-status="wish">読みたい</button><button data-status="reading">読書中</button><button data-status="done">読了</button></div><input id="filter" type="search" placeholder="記録した本を検索" aria-label="記録した本を検索"></div><div class="demo-bar" id="demo-bar"><span id="demo-label"></span><button id="demo-toggle" type="button"></button></div><div id="books" class="timeline" role="tabpanel" aria-labelledby="view-timeline"></div></main>
<footer><span class="muted">記録はこのブラウザに保存されます。定期的にバックアップしてください。</span><div class="actions"><button id="export">書き出し</button><button id="import">読み込み</button><input id="importfile" type="file" accept="application/json,.json" hidden></div></footer>
<dialog id="searchdialog"><div class="dialoghead"><h2>本を登録</h2><button type="button" data-close aria-label="閉じる">×</button></div><form id="searchform"><label for="query">タイトル・著者名・ISBNで検索</label><div class="actions"><input id="query" style="flex:1;min-width:120px" required placeholder="本のタイトルなど"><button class="primary" id="searchbutton">検索</button></div></form><p class="muted" id="searchmessage" role="status">Google Booksから本の情報を探します。</p><div id="results" class="results"></div><div class="separator">見つからない本はこちらから</div><button id="manual" style="width:100%">手動で登録する</button></dialog>
<dialog id="editdialog"><div class="dialoghead"><h2 id="edittitle">本の記録</h2><button type="button" data-close aria-label="閉じる">×</button></div><form id="editform"><label for="title">タイトル（必須）</label><input class="field" id="title" required maxlength="300"><label for="author">著者</label><input class="field" id="author" maxlength="300"><div class="row"><div><label for="status">読書状況</label><select class="field" id="status"><option value="wish">読みたい</option><option value="reading">読書中</option><option value="done">読了</option></select></div><div><label for="date">読了日</label><input class="field" id="date" type="date"></div></div><label for="note">感想・メモ</label><textarea id="note" placeholder="心に残ったことを、自由に。" maxlength="20000"></textarea><div class="formactions"><button class="danger" id="delete" type="button">削除</button><button type="button" data-close>キャンセル</button><button class="primary">保存する</button></div></form></dialog><div class="message" id="message" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='recotte.books.v1',names={wish:'読みたい',reading:'読書中',done:'読了'};
let books=[],filter='all',editing=null,searchController=null,view='timeline',showDemo=true;
const demoBooks=[
{title:'星を編む',author:'朝の文庫',status:'done',date:'2026-10-20',note:'最後のページを閉じてからも、登場人物の暮らしが続いているような気がした。静かな場面ほど心に残る。',color:'#687d8b'},
{title:'喫茶と雨の日',author:'三月しおり',status:'reading',date:'',note:'雨の音を聞きながら、少しずつ読み進めています。',color:'#9e7960'},
{title:'遠い街の手紙',author:'青井はる',status:'wish',date:'',note:'旅に持っていきたい一冊。',color:'#a18b59'},
{title:'森の向こうへ',author:'小野なつめ',status:'done',date:'2026-10-16',note:'いつもの道も、少し違って見えるようになった。',color:'#637d69'},
{title:'夜明けの台所',author:'水野あかり',status:'done',date:'2026-10-12',note:'料理の描写が好き。温かいスープを作りたくなる。',color:'#b07d73'},
{title:'余白のある日々',author:'日々出版',status:'wish',date:'',note:'',color:'#8e86a0'},
{title:'海辺のノート',author:'夏川みお',status:'done',date:'2026-10-08',note:'海の匂いまで伝わってくるような文章でした。',color:'#679497'},
{title:'小さな旅の途中',author:'山路ふみ',status:'reading',date:'',note:'週末に一章ずつ。',color:'#b39a74'},
{title:'月と図書室',author:'白石ゆう',status:'wish',date:'',note:'',color:'#636d8c'}
].map((b,i)=>({...b,id:'demo-'+i,cover:'',demo:true,updatedAt:'2026-10-'+String(21-i).padStart(2,'0')}));
function notify(s){$('message').textContent=s;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('message').textContent='',5000)}
function validBook(b){return b&&typeof b.id==='string'&&typeof b.title==='string'&&b.title.trim()&&names[b.status]&&['author','note','date','cover'].every(k=>typeof b[k]==='string')&&(!b.date||/^\d{4}-\d{2}-\d{2}$/.test(b.date))}
try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data)||!data.every(validBook))throw Error();books=data}catch{notify('保存した記録を読み込めませんでした。読み込み機能からバックアップを復元できます。')}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));books=next;render();return true}catch{notify('保存できませんでした。ブラウザの保存設定や空き容量をご確認ください。');return false}}
function coverNode(url){const e=document.createElement('img');e.className='cover';e.alt='表紙';if(/^https:\/\//.test(url)){e.src=url;e.loading='lazy';e.referrerPolicy='no-referrer';e.onerror=()=>{e.replaceWith(coverNode(''))}}else{const p=document.createElement('div');p.className='cover';p.textContent='Recotte!';return p}return e}
function textNode(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
function bookCover(b){const e=coverNode(b.cover);if(!b.cover){e.classList.add('fallback');e.style.setProperty('--book-color',b.color||['#687d8b','#9e7960','#637d69','#8e86a0'][b.title.length%4]);e.replaceChildren(textNode('small','RECOTTE LIBRARY'),textNode('strong',b.title),textNode('small',b.author))}return e}
function selectBook(b){if(b.demo){notify('表示見本の本です。「本を登録」から自分の記録を追加できます。');return}openEditor(b)}
function render(){const demo=!books.length&&showDemo,source=demo?demoBooks:books,counts={wish:0,reading:0,done:0};source.forEach(b=>counts[b.status]++);$('demo-bar').hidden=!!books.length;$('demo-label').textContent=demo?'表示見本 · 本のタイトル・著者・感想は架空です。':'まだ読書記録はありません。';$('demo-toggle').textContent=demo?'見本を非表示':'見本を表示';const container=$('books');container.className=view==='cards'?'grid cards':view;container.setAttribute('aria-labelledby','view-'+view);container.replaceChildren();const q=$('filter').value.trim().toLocaleLowerCase();const visible=source.filter(b=>(filter==='all'||b.status===filter)&&`${b.title} ${b.author} ${b.note}`.toLocaleLowerCase().includes(q)).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));if(!visible.length){const e=textNode('div','','empty');e.append(textNode('h2',source.length?'該当する記録がありません':'最初の1冊を、記録しましょう。'),textNode('p',source.length?'検索条件や読書状況を変えてみてください。':'読みたい本も、読み終えた本も。自分だけの読書記録を。','muted'));container.append(e);return}let shelfRow;
for(const [i,b] of visible.entries()){
if(view==='timeline'){const post=textNode('article','','post'),content=textNode('div','','post-content'),meta=textNode('div','','post-meta');meta.append(textNode('strong','わたし'),textNode('span',b.date||'読書メモ','muted'));content.append(meta,textNode('p',b.note||'「'+b.title+'」を'+names[b.status]+'に追加しました。','post-note'));const book=textNode('button','','post-book'),info=textNode('div','','info');book.type='button';info.append(textNode('h3',b.title),textNode('div',b.author||'著者未登録','muted'));book.append(bookCover(b),info);book.onclick=()=>selectBook(b);content.append(book,textNode('div',names[b.status],'post-status'));post.append(textNode('div','R','avatar'),content);container.append(post)}
else if(view==='cards'){const card=textNode('button','','card'),art=textNode('div','','card-art'),info=textNode('div','','info');card.type='button';card.setAttribute('aria-label',b.title+'の記録');art.append(bookCover(b));info.append(textNode('span',names[b.status],'badge'),textNode('h3',b.title),textNode('div',b.author||'著者未登録','muted'));if(b.date)info.append(textNode('p',b.date,'muted'));info.append(textNode('p',b.note||'まだ感想はありません。','excerpt'));card.append(art,info);card.onclick=()=>selectBook(b);container.append(card)}
else{const columns=window.matchMedia('(max-width:600px)').matches?3:6;if(i%columns===0){shelfRow=textNode('div','','shelf-row');container.append(shelfRow)}const book=textNode('button','','shelf-book');book.type='button';book.title=b.title+' / '+b.author+' / '+names[b.status];book.setAttribute('aria-label',book.title);book.append(bookCover(b),textNode('span',b.title,'book-title'));book.onclick=()=>selectBook(b);shelfRow.append(book)}}}
function setView(next){view=next;document.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===view;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1});render()}
document.querySelector('.view-tabs').onclick=e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)};
document.querySelector('.view-tabs').onkeydown=e=>{const views=['timeline','cards','shelf'];let index=views.indexOf(view);if(e.key==='ArrowRight')index=(index+1)%3;else if(e.key==='ArrowLeft')index=(index+2)%3;else if(e.key==='Home')index=0;else if(e.key==='End')index=2;else return;e.preventDefault();setView(views[index]);$('view-'+views[index]).focus()};
$('demo-toggle').onclick=()=>{showDemo=!showDemo;render()};window.matchMedia('(max-width:600px)').addEventListener('change',()=>{if(view==='shelf')render()});
function openEditor(b=null){editing=b?{...b}:{id:crypto.randomUUID(),title:'',author:'',status:'wish',date:'',note:'',cover:''};for(const k of ['title','author','status','date','note'])$(k).value=editing[k];$('delete').classList.toggle('hidden',!books.some(x=>x.id===editing.id));$('edittitle').textContent=books.some(x=>x.id===editing.id)?'本の記録を編集':'本の記録';$('searchdialog').close();$('editdialog').showModal()}
$('add').onclick=()=>$('searchdialog').showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('manual').onclick=()=>openEditor();$('filter').oninput=render;
$('tabs').onclick=e=>{const b=e.target.closest('[data-status]');if(!b)return;filter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()};
$('editform').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').setCustomValidity('タイトルを入力してください。');$('title').reportValidity();return}const b={...editing,title,author:$('author').value.trim(),status:$('status').value,date:$('date').value,note:$('note').value.trim(),updatedAt:new Date().toISOString()};if(persist([...books.filter(x=>x.id!==b.id),b])){$('editdialog').close();notify('記録を保存しました。')}};$('title').oninput=()=>$('title').setCustomValidity('');
$('delete').onclick=()=>{if(confirm(`「${editing.title}」の記録を削除しますか？`)&&persist(books.filter(b=>b.id!==editing.id))){$('editdialog').close();notify('記録を削除しました。')}};
$('searchform').onsubmit=async e=>{e.preventDefault();const q=$('query').value.trim();if(!q)return;searchController?.abort();const controller=new AbortController();searchController=controller;const timeout=setTimeout(()=>controller.abort(),15000);$('searchbutton').disabled=true;$('results').replaceChildren();$('searchmessage').textContent='検索しています…';try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=20&printType=books&langRestrict=ja',{signal:controller.signal});if(!r.ok)throw Error();const data=await r.json();const items=data.items||[];$('searchmessage').textContent=items.length?'本を選ぶと記録を入力できます。':'見つかりませんでした。別のキーワードや手動登録をお試しください。';for(const item of items){const v=item.volumeInfo||{},b={id:crypto.randomUUID(),title:v.title||'タイトル不明',author:(v.authors||[]).join('、'),status:'wish',date:'',note:'',cover:(v.imageLinks?.thumbnail||'').replace(/^http:/,'https:')};const button=textNode('button','','result');button.type='button';const info=textNode('span','');info.append(textNode('strong',b.title),textNode('div',[b.author,v.publisher,v.publishedDate].filter(Boolean).join(' / '),'muted'));button.append(coverNode(b.cover),info);button.onclick=()=>openEditor(b);$('results').append(button)}}catch{$('searchmessage').textContent='検索できませんでした。通信状況を確認するか、手動で登録してください。'}finally{clearTimeout(timeout);$('searchbutton').disabled=false}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,books},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='recotte-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('importfile').click();$('importfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error();const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.books)||!data.books.every(validBook))throw Error();const incoming=new Map(data.books.map(b=>[b.id,b]));const collisions=books.some(b=>incoming.has(b.id));if(collisions&&!confirm('同じ記録はバックアップの内容で上書きします。読み込みますか？'))return;if(persist([...books.filter(b=>!incoming.has(b.id)),...incoming.values()]))notify('バックアップを読み込みました。')}catch{notify('読み込めませんでした。Recotte! のバックアップJSONを選んでください。')}finally{e.target.value=''}};
render();
</script></body></html>
