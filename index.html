<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#526b50"><title>Recotte! | レコッテ！</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#28362b;background:#f7f6f2;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d7ddd2;background:#fff;border-radius:9px;padding:10px 16px;color:inherit}button:hover{background:#edf1e9}button:disabled{opacity:.5;cursor:wait}.primary{background:#526b50;color:white;border-color:#526b50}.primary:hover{background:#40563e}header{border-bottom:1px solid #e1e3db;background:#ffffffb0}header>div,main{max-width:1080px;margin:auto;padding:24px}header>div{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:27px;font-weight:750;letter-spacing:-1px}.brand small{font-size:12px;font-weight:400;letter-spacing:1px;margin-left:12px;color:#717c70}h1{font-size:28px;margin:0 0 8px}h2{font-size:20px;margin:0}p{line-height:1.8}.muted{color:#707b6e;font-size:13px}.intro{margin:28px 0}.toolbar,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between;margin:28px 0 20px}.tabs button{border:0;background:transparent}.tabs button.active{background:#e1e9db;color:#334d31}input,select,textarea{padding:11px 12px;border:1px solid #d7ddd2;border-radius:8px;background:white;color:inherit;max-width:100%}textarea{resize:vertical;width:100%;min-height:120px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #e2e5dd;border-radius:14px;padding:20px;display:flex;gap:16px;text-align:left;width:100%;min-height:190px}.cover{width:80px;height:115px;object-fit:contain;background:#e9e9de;flex-shrink:0;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#78816f}.info{min-width:0}.info h3{font-size:16px;line-height:1.6;margin:5px 0;overflow-wrap:anywhere}.badge{font-size:11px;background:#edf1e9;padding:4px 8px;border-radius:5px}.excerpt{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;border:1px dashed #cdd5c7;border-radius:14px;background:#ffffff70}.empty h2{margin:16px 0 8px}footer{max-width:1080px;margin:45px auto 0;padding:24px;border-top:1px solid #e1e3db;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}footer button{font-size:12px;padding:6px 10px;background:transparent}dialog{border:1px solid #dce2d5;border-radius:16px;padding:25px;width:min(580px,calc(100% - 28px));max-height:90dvh;overflow-y:auto;color:inherit;background:#fafbf7}dialog::backdrop{background:#24312775}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.dialoghead button{border:0;background:none;font-size:20px;padding:2px 10px}label{display:block;font-size:13px;margin:16px 0 6px}.field{width:100%}.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}.results{max-height:350px;overflow:auto;margin:14px 0}.result{width:100%;display:flex;gap:12px;text-align:left;margin-bottom:8px}.result img{width:40px;height:60px;object-fit:contain}.result span{flex:1}.separator{text-align:center;color:#7f8978;font-size:12px;margin:24px 0 12px}.danger{color:#a5473b;margin-right:auto}.message{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#283d2a;color:#fff;padding:12px 22px;border-radius:10px;z-index:5;max-width:90%;font-size:13px}.message:empty{display:none}.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){header>div,main{padding:20px}.brand small{display:block;margin:3px 0 0}.brand{font-size:24px}.intro{margin:18px 0}h1{font-size:24px}.grid{grid-template-columns:1fr}.toolbar{align-items:stretch}.toolbar input{width:100%}.tabs{gap:0}.tabs button{padding:10px}.card{min-height:160px}.row{flex-direction:column;gap:0}footer{margin-top:24px;padding:20px}.cover{width:72px;height:105px}}
</style></head>
<body><header><div><div class="brand">Recotte! <small>レコッテ！ / 作品手帳</small></div><button class="primary" id="add">＋ 本を登録</button></div></header>
<main><div class="intro"><p class="muted">MY READING RECORD</p><h1>読んだ本と、感じたこと。</h1><p class="muted" id="summary"></p></div><div class="toolbar"><div class="tabs" id="tabs"><button data-status="all" class="active">すべて</button><button data-status="wish">読みたい</button><button data-status="reading">読書中</button><button data-status="done">読了</button></div><input id="filter" type="search" placeholder="記録した本を検索" aria-label="記録した本を検索"></div><div id="books" class="grid"></div></main>
<footer><span class="muted">記録はこのブラウザに保存されます。定期的にバックアップしてください。</span><div class="actions"><button id="export">書き出し</button><button id="import">読み込み</button><input id="importfile" type="file" accept="application/json,.json" hidden></div></footer>
<dialog id="searchdialog"><div class="dialoghead"><h2>本を登録</h2><button type="button" data-close aria-label="閉じる">×</button></div><form id="searchform"><label for="query">タイトル・著者名・ISBNで検索</label><div class="actions"><input id="query" style="flex:1;min-width:120px" required placeholder="本のタイトルなど"><button class="primary" id="searchbutton">検索</button></div></form><p class="muted" id="searchmessage" role="status">Google Booksから本の情報を探します。</p><div id="results" class="results"></div><div class="separator">見つからない本はこちらから</div><button id="manual" style="width:100%">手動で登録する</button></dialog>
<dialog id="editdialog"><div class="dialoghead"><h2 id="edittitle">本の記録</h2><button type="button" data-close aria-label="閉じる">×</button></div><form id="editform"><label for="title">タイトル（必須）</label><input class="field" id="title" required maxlength="300"><label for="author">著者</label><input class="field" id="author" maxlength="300"><div class="row"><div><label for="status">読書状況</label><select class="field" id="status"><option value="wish">読みたい</option><option value="reading">読書中</option><option value="done">読了</option></select></div><div><label for="date">読了日</label><input class="field" id="date" type="date"></div></div><label for="note">感想・メモ</label><textarea id="note" placeholder="心に残ったことを、自由に。" maxlength="20000"></textarea><div class="formactions"><button class="danger" id="delete" type="button">削除</button><button type="button" data-close>キャンセル</button><button class="primary">保存する</button></div></form></dialog><div class="message" id="message" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='recotte.books.v1',names={wish:'読みたい',reading:'読書中',done:'読了'};
let books=[],filter='all',editing=null,searchController=null;
function notify(s){$('message').textContent=s;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('message').textContent='',5000)}
function validBook(b){return b&&typeof b.id==='string'&&typeof b.title==='string'&&b.title.trim()&&names[b.status]&&['author','note','date','cover'].every(k=>typeof b[k]==='string')&&(!b.date||/^\d{4}-\d{2}-\d{2}$/.test(b.date))}
try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data)||!data.every(validBook))throw Error();books=data}catch{notify('保存した記録を読み込めませんでした。読み込み機能からバックアップを復元できます。')}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));books=next;render();return true}catch{notify('保存できませんでした。ブラウザの保存設定や空き容量をご確認ください。');return false}}
function coverNode(url){const e=document.createElement('img');e.className='cover';e.alt='表紙';if(/^https:\/\//.test(url)){e.src=url;e.loading='lazy';e.referrerPolicy='no-referrer';e.onerror=()=>{e.replaceWith(coverNode(''))}}else{const p=document.createElement('div');p.className='cover';p.textContent='Recotte!';return p}return e}
function textNode(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
function render(){const counts={wish:0,reading:0,done:0};books.forEach(b=>counts[b.status]++);$('summary').textContent=`${books.length}冊の記録　·　読了 ${counts.done}冊　·　読書中 ${counts.reading}冊`;$('books').replaceChildren();const q=$('filter').value.trim().toLocaleLowerCase();const visible=books.filter(b=>(filter==='all'||b.status===filter)&&`${b.title} ${b.author} ${b.note}`.toLocaleLowerCase().includes(q)).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));if(!visible.length){const e=textNode('div','','empty');e.append(textNode('h2',books.length?'該当する記録がありません':'最初の1冊を、記録しましょう。'),textNode('p',books.length?'検索条件や読書状況を変えてみてください。':'読みたい本も、読み終えた本も。自分だけの読書記録を。','muted'));$('books').append(e)}for(const b of visible){const card=textNode('button','','card');card.type='button';card.setAttribute('aria-label',b.title+'を編集');const info=textNode('div','','info');info.append(textNode('span',names[b.status],'badge'),textNode('h3',b.title),textNode('div',b.author||'著者未登録','muted'));if(b.date)info.append(textNode('p',b.date,'muted'));if(b.note)info.append(textNode('p',b.note,'excerpt'));card.append(coverNode(b.cover),info);card.onclick=()=>openEditor(b);$('books').append(card)}}
function openEditor(b=null){editing=b?{...b}:{id:crypto.randomUUID(),title:'',author:'',status:'wish',date:'',note:'',cover:''};for(const k of ['title','author','status','date','note'])$(k).value=editing[k];$('delete').classList.toggle('hidden',!books.some(x=>x.id===editing.id));$('edittitle').textContent=books.some(x=>x.id===editing.id)?'本の記録を編集':'本の記録';$('searchdialog').close();$('editdialog').showModal()}
$('add').onclick=()=>$('searchdialog').showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('manual').onclick=()=>openEditor();$('filter').oninput=render;
$('tabs').onclick=e=>{const b=e.target.closest('[data-status]');if(!b)return;filter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()};
$('editform').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').setCustomValidity('タイトルを入力してください。');$('title').reportValidity();return}const b={...editing,title,author:$('author').value.trim(),status:$('status').value,date:$('date').value,note:$('note').value.trim(),updatedAt:new Date().toISOString()};if(persist([...books.filter(x=>x.id!==b.id),b])){$('editdialog').close();notify('記録を保存しました。')}};$('title').oninput=()=>$('title').setCustomValidity('');
$('delete').onclick=()=>{if(confirm(`「${editing.title}」の記録を削除しますか？`)&&persist(books.filter(b=>b.id!==editing.id))){$('editdialog').close();notify('記録を削除しました。')}};
$('searchform').onsubmit=async e=>{e.preventDefault();const q=$('query').value.trim();if(!q)return;searchController?.abort();const controller=new AbortController();searchController=controller;const timeout=setTimeout(()=>controller.abort(),15000);$('searchbutton').disabled=true;$('results').replaceChildren();$('searchmessage').textContent='検索しています…';try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=20&printType=books&langRestrict=ja',{signal:controller.signal});if(!r.ok)throw Error();const data=await r.json();const items=data.items||[];$('searchmessage').textContent=items.length?'本を選ぶと記録を入力できます。':'見つかりませんでした。別のキーワードや手動登録をお試しください。';for(const item of items){const v=item.volumeInfo||{},b={id:crypto.randomUUID(),title:v.title||'タイトル不明',author:(v.authors||[]).join('、'),status:'wish',date:'',note:'',cover:(v.imageLinks?.thumbnail||'').replace(/^http:/,'https:')};const button=textNode('button','','result');button.type='button';const info=textNode('span','');info.append(textNode('strong',b.title),textNode('div',[b.author,v.publisher,v.publishedDate].filter(Boolean).join(' / '),'muted'));button.append(coverNode(b.cover),info);button.onclick=()=>openEditor(b);$('results').append(button)}}catch{$('searchmessage').textContent='検索できませんでした。通信状況を確認するか、手動で登録してください。'}finally{clearTimeout(timeout);$('searchbutton').disabled=false}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,books},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='recotte-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('importfile').click();$('importfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error();const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.books)||!data.books.every(validBook))throw Error();const incoming=new Map(data.books.map(b=>[b.id,b]));const collisions=books.some(b=>incoming.has(b.id));if(collisions&&!confirm('同じ記録はバックアップの内容で上書きします。読み込みますか？'))return;if(persist([...books.filter(b=>!incoming.has(b.id)),...incoming.values()]))notify('バックアップを読み込みました。')}catch{notify('読み込めませんでした。Recotte! のバックアップJSONを選んでください。')}finally{e.target.value=''}};
render();
</script></body></html>
