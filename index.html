.post-book h3{font-size:14px;line-height:1.6;margin:2px 0 6px}
.post-status{color:#92998e;font-size:11px;margin-top:12px}
.post .tag-chips{margin-top:10px}
.grid.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 18px;align-items:start}
.cards .card{display:block;border:0;border-radius:0;padding:0;background:transparent;box-shadow:none;text-align:left;min-height:0;overflow:visible;transition:none}
.cards .card:hover{background:transparent;transform:none;box-shadow:none}
.card-art{aspect-ratio:1;height:auto;padding:32px;background:#efefea;border:1px solid #00000004;border-radius:3px;display:flex;justify-content:center;align-items:center}
.cards .card:nth-child(4n+2) .card-art{background:#eee8e1}
.cards .card:nth-child(4n+3) .card-art{background:#e6ecec}
.cards .card:nth-child(4n) .card-art{background:#ece7eb}
.card-art .cover{height:auto;width:53%;aspect-ratio:2/3;box-shadow:3px 5px 10px #27312818}
.cards .info{padding:11px 2px 0}
.cards .info>.badge{display:none}
.cards .info h3{font-size:14px;line-height:1.6;font-weight:600;margin:0 0 4px}
.cards .info>.muted{font-size:12px}
.cards .info>p.muted{display:none}
.cards .excerpt{font-size:12px;line-height:1.8;min-height:0;margin:7px 0 0;-webkit-line-clamp:2;color:#788172}
.cards .tag-chips{margin-top:7px;font-size:11px}
.shelf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:start;gap:30px 26px;background:transparent;border:0;border-radius:0;padding:6px 0 20px;overflow:visible}
.shelf-book{position:static;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:11px;min-width:0;padding:0;background:transparent;border:0;border-radius:0}
.shelf-book:hover{background:transparent}
.shelf-book .cover{width:100%;max-width:120px;height:auto;aspect-ratio:2/3;object-fit:contain;border-radius:1px;box-shadow:1px 3px 6px #00000012;transition:none}
.shelf-book:hover .cover{transform:none}
.shelf-book .book-title{position:static;font-size:12px;line-height:1.6;color:#4e574c;max-width:140px;white-space:normal;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.shelf .empty{grid-column:1/-1;width:100%}
@media(max-width:900px){.shelf{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 24px}}
@media(max-width:600px){
.timeline{margin:0 -18px;border-left:0;border-right:0}
.post{padding:20px 18px;gap:10px}.avatar{width:33px;height:33px;font-size:14px}
.post-meta strong{font-size:13px}.post-meta .muted{font-size:11px}
.post-note{font-size:14px}.post-book h3{font-size:13px}
.grid.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:23px 12px}
.card-art{height:auto;padding:20px;border-radius:2px}
.card-art .cover{width:60%;height:auto}
.cards .info{padding:9px 1px 0}.cards .info h3{font-size:13px}.cards .info>.muted{font-size:11px}.cards .excerpt{font-size:11px}.cards .tag-chips{font-size:10px}
.shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 20px;padding:3px 2px 20px}
.shelf-book{gap:10px}.shelf-book .cover{height:auto;max-width:100px}.shelf-book .book-title{font-size:11px}
}


/* Shelves retain only the cover and title for each book. */
.shelf{display:block;background:#f0eee7;border:1px solid #e6e2d9;border-radius:12px;padding:8px 24px 0;overflow:hidden}
.shelf-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;gap:26px;padding:30px 12px 0;border-bottom:10px solid #d4c6ae;margin-bottom:47px;box-shadow:0 5px 6px -4px #67594433}
.shelf-book{position:relative;gap:0;justify-content:flex-end}
.shelf-book .cover{max-width:110px;box-shadow:2px 2px 5px #0002}
.shelf-book .book-title{position:absolute;top:calc(100% + 16px);bottom:auto;width:100%;max-width:140px;line-height:1.5;font-size:11px;color:#817767}
@media(max-width:900px){.shelf-row{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){.shelf{padding:5px 12px 0}.shelf-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:25px 7px 0;margin-bottom:45px}.shelf-book .cover{max-width:100px}.shelf-book .book-title{font-size:10px}}
</style></head>
<body><header><div><div class="brand">Recotte! <small>レコッテ！</small></div><button class="primary" id="add">＋ 本を登録</button></div></header>
<main><div class="toolbar"><select id="view-select" aria-label="表示形式"><option value="timeline">タイムライン</option><option value="cards">タイル</option><option value="shelf">本棚</option></select><div class="tabs" id="tabs"><button data-status="all" class="active">すべて</button><button data-status="wish">読みたい</button><button data-status="reading">読書中</button><button data-status="done">読了</button></div><details class="tag-picker" id="tag-picker"><summary id="tag-summary">ハッシュタグ</summary><div id="tag-options"></div></details><input id="filter" type="search" placeholder="記録した本を検索" aria-label="記録した本を検索"></div><div class="demo-bar" id="demo-bar"><span id="demo-label"></span><button id="demo-toggle" type="button"></button></div><div id="books" class="timeline" role="tabpanel" aria-label="読書記録"></div></main>
<footer><span class="muted">記録はこのブラウザに保存されます。定期的にバックアップしてください。</span><div class="actions"><button id="export">書き出し</button><button id="import">読み込み</button><input id="importfile" type="file" accept="application/json,.json" hidden></div></footer>
<dialog id="searchdialog"><div class="dialoghead"><h2>本を登録</h2><button type="button" data-close aria-label="閉じる">×</button></div><form id="searchform"><label for="query">タイトル・著者名・ISBNで検索</label><div class="actions"><input id="query" style="flex:1;min-width:120px" required placeholder="本のタイトルなど"><button class="primary" id="searchbutton">検索</button></div></form><p class="muted" id="searchmessage" role="status">Google Booksから本の情報を探します。</p><div id="results" class="results"></div><div class="separator">見つからない本はこちらから</div><button id="manual" style="width:100%">手動で登録する</button></dialog>
<dialog id="editdialog"><div class="dialoghead"><h2 id="edittitle">本の記録</h2><button type="button" data-close aria-label="閉じる">×</button></div><form id="editform"><label for="title">タイトル（必須）</label><input class="field" id="title" required maxlength="300"><label for="author">著者</label><input class="field" id="author" maxlength="300"><div class="row"><div><label for="status">読書状況</label><select class="field" id="status"><option value="wish">読みたい</option><option value="reading">読書中</option><option value="done">読了</option></select></div><div><label for="date">読了日</label><input class="field" id="date" type="date"></div></div><label for="tags">ハッシュタグ</label><input class="field" id="tags" placeholder="#小説 #お気に入り" maxlength="500"><label for="note">感想・メモ</label><textarea id="note" placeholder="心に残ったことを、自由に。" maxlength="20000"></textarea><div class="formactions"><button class="danger" id="delete" type="button">削除</button><button type="button" data-close>キャンセル</button><button class="primary">保存する</button></div></form></dialog><div class="message" id="message" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='recotte.books.v1',names={wish:'読みたい',reading:'読書中',done:'読了'};
let books=[],filter='all',editing=null,searchController=null,view='timeline',showDemo=true,selectedTags=new Set();
const demoBooks=[
{title:'星を編む',author:'朝の文庫',status:'done',date:'2026-10-20',note:'最後のページを閉じてからも、登場人物の暮らしが続いているような気がした。静かな場面ほど心に残る。',color:'#687d8b'},
{title:'喫茶と雨の日',author:'三月しおり',status:'reading',date:'',note:'雨の音を聞きながら、少しずつ読み進めています。',color:'#9e7960'},
{title:'遠い街の手紙',author:'青井はる',status:'wish',date:'',note:'旅に持っていきたい一冊。',color:'#a18b59'},
{title:'森の向こうへ',author:'小野なつめ',status:'done',date:'2026-10-16',note:'いつもの道も、少し違って見えるようになった。',color:'#637d69'},
{title:'夜明けの台所',author:'水野あかり',status:'done',date:'2026-10-12',note:'料理の描写が好き。温かいスープを作りたくなる。',color:'#b07d73'},
{title:'余白のある日々',author:'日々出版',status:'wish',date:'',note:'',color:'#8e86a0'},
{title:'海辺のノート',author:'夏川みお',status:'done',date:'2026-10-08',note:'海の匂いまで伝わってくるような文章でした。',color:'#679497'},
{title:'小さな旅の途中',author:'山路ふみ',status:'reading',date:'',note:'週末に一章ずつ。',color:'#b39a74'},
{title:'月と図書室',author:'白石ゆう',status:'wish',date:'',note:'',color:'#636d8c'}
].map((b,i)=>({...b,tags:i%3===0?['小説','お気に入り']:i%3===1?['小説','日々']:['エッセイ'],id:'demo-'+i,cover:'',demo:true,updatedAt:'2026-10-'+String(21-i).padStart(2,'0')}));
function notify(s){$('message').textContent=s;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('message').textContent='',5000)}
function validBook(b){return b&&typeof b.id==='string'&&typeof b.title==='string'&&b.title.trim()&&names[b.status]&&['author','note','date','cover'].every(k=>typeof b[k]==='string')&&(!b.date||/^\d{4}-\d{2}-\d{2}$/.test(b.date))}
try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data)||!data.every(validBook))throw Error();books=data}catch{notify('保存した記録を読み込めませんでした。読み込み機能からバックアップを復元できます。')}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));books=next;render();return true}catch{notify('保存できませんでした。ブラウザの保存設定や空き容量をご確認ください。');return false}}
function coverNode(url){const e=document.createElement('img');e.className='cover';e.alt='表紙';if(/^https:\/\//.test(url)){e.src=url;e.loading='lazy';e.referrerPolicy='no-referrer';e.onerror=()=>{e.replaceWith(coverNode(''))}}else{const p=document.createElement('div');p.className='cover';p.textContent='Recotte!';return p}return e}
function textNode(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
function tagsOf(b){return [...new Set([...(Array.isArray(b.tags)?b.tags.filter(t=>typeof t==='string'):[]),...(b.note.match(/#[^\s#]+/g)||[]).map(t=>t.slice(1))])]}
function renderTags(source){const tags=[...new Set(source.flatMap(tagsOf))].sort((a,b)=>a.localeCompare(b,'ja'));selectedTags=new Set([...selectedTags].filter(t=>tags.includes(t)));$('tag-summary').textContent=selectedTags.size?'ハッシュタグ ('+selectedTags.size+')':'ハッシュタグ';$('tag-options').replaceChildren();if(!tags.length)$('tag-options').append(textNode('p','タグはまだありません。','muted'));for(const tag of tags){const label=textNode('label','','tag-option'),input=document.createElement('input');input.type='checkbox';input.checked=selectedTags.has(tag);input.onchange=()=>{input.checked?selectedTags.add(tag):selectedTags.delete(tag);render()};label.append(input,textNode('span','#'+tag));$('tag-options').append(label)}if(selectedTags.size){const clear=textNode('button','選択をクリア');clear.type='button';clear.onclick=()=>{selectedTags.clear();render()};$('tag-options').append(clear)}}
function tagChips(b){const wrap=textNode('div','','tag-chips');for(const t of tagsOf(b))wrap.append(textNode('span','#'+t));return wrap}
function bookCover(b){const e=coverNode(b.cover);if(!b.cover){e.classList.add('fallback');e.style.setProperty('--book-color',b.color||['#687d8b','#9e7960','#637d69','#8e86a0'][b.title.length%4]);e.replaceChildren(textNode('small','RECOTTE LIBRARY'),textNode('strong',b.title),textNode('small',b.author))}return e}
function selectBook(b){if(b.demo){notify('表示見本の本です。「本を登録」から自分の記録を追加できます。');return}openEditor(b)}
function render(){const demo=!books.length&&showDemo,source=demo?demoBooks:books,counts={wish:0,reading:0,done:0};source.forEach(b=>counts[b.status]++);$('demo-bar').hidden=!!books.length;$('demo-label').textContent=demo?'表示見本 · 本のタイトル・著者・感想は架空です。':'まだ読書記録はありません。';$('demo-toggle').textContent=demo?'見本を非表示':'見本を表示';const container=$('books');container.className=view==='cards'?'grid cards':view;renderTags(source);container.replaceChildren();const q=$('filter').value.trim().toLocaleLowerCase();const visible=source.filter(b=>(filter==='all'||b.status===filter)&&[...selectedTags].every(t=>tagsOf(b).includes(t))&&`${b.title} ${b.author} ${b.note}`.toLocaleLowerCase().includes(q)).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));if(!visible.length){const e=textNode('div','','empty');e.append(textNode('h2',source.length?'該当する記録がありません':'最初の1冊を、記録しましょう。'),textNode('p',source.length?'検索条件や読書状況を変えてみてください。':'読みたい本も、読み終えた本も。自分だけの読書記録を。','muted'));container.append(e);return}let shelfRow;
for(const [i,b] of visible.entries()){
if(view==='timeline'){const post=textNode('article','','post'),content=textNode('div','','post-content'),meta=textNode('div','','post-meta');meta.append(textNode('strong','わたし'),textNode('span',b.date||'読書メモ','muted'));content.append(meta,textNode('p',b.note||'「'+b.title+'」を'+names[b.status]+'に追加しました。','post-note'));const book=textNode('button','','post-book'),info=textNode('div','','info');book.type='button';info.append(textNode('h3',b.title),textNode('div',b.author||'著者未登録','muted'));book.append(bookCover(b),info);book.onclick=()=>selectBook(b);content.append(book,tagChips(b),textNode('div',names[b.status],'post-status'));post.append(textNode('div','R','avatar'),content);container.append(post)}
else if(view==='cards'){const card=textNode('button','','card'),art=textNode('div','','card-art'),info=textNode('div','','info');card.type='button';card.setAttribute('aria-label',b.title+'の記録');art.append(bookCover(b));info.append(textNode('span',names[b.status],'badge'),textNode('h3',b.title),textNode('div',b.author||'著者未登録','muted'));if(b.date)info.append(textNode('p',b.date,'muted'));info.append(textNode('p',b.note||'まだ感想はありません。','excerpt'));info.append(tagChips(b));card.append(art,info);card.onclick=()=>selectBook(b);container.append(card)}
else{const columns=window.matchMedia('(max-width:600px)').matches?3:window.matchMedia('(max-width:900px)').matches?4:6;if(i%columns===0){shelfRow=textNode('div','','shelf-row');container.append(shelfRow)}const book=textNode('button','','shelf-book');book.type='button';book.title=b.title+' / '+b.author+' / '+names[b.status];book.setAttribute('aria-label',book.title);book.append(bookCover(b),textNode('span',b.title,'book-title'));book.onclick=()=>selectBook(b);shelfRow.append(book)}}}
function setView(next){view=next;render()}
$('view-select').onchange=e=>setView(e.target.value);
document.addEventListener('click',e=>{if(!$('tag-picker').contains(e.target))$('tag-picker').open=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('tag-picker').open=false});
$('demo-toggle').onclick=()=>{showDemo=!showDemo;render()};for(const query of ['(max-width:600px)','(max-width:900px)'])window.matchMedia(query).addEventListener('change',()=>{if(view==='shelf')render()});
function openEditor(b=null){editing=b?{...b}:{id:crypto.randomUUID(),title:'',author:'',status:'wish',date:'',note:'',cover:''};for(const k of ['title','author','status','date','note'])$(k).value=editing[k];$('tags').value=tagsOf(editing).map(t=>'#'+t).join(' ');$('delete').classList.toggle('hidden',!books.some(x=>x.id===editing.id));$('edittitle').textContent=books.some(x=>x.id===editing.id)?'本の記録を編集':'本の記録';$('searchdialog').close();$('editdialog').showModal()}
$('add').onclick=()=>$('searchdialog').showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('manual').onclick=()=>openEditor();$('filter').oninput=render;
$('tabs').onclick=e=>{const b=e.target.closest('[data-status]');if(!b)return;filter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()};
$('editform').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').setCustomValidity('タイトルを入力してください。');$('title').reportValidity();return}const b={...editing,title,author:$('author').value.trim(),status:$('status').value,date:$('date').value,note:$('note').value.trim(),tags:[...new Set($('tags').value.split(/[\s,、]+/).map(t=>t.replace(/^#+/,'')).filter(Boolean))],updatedAt:new Date().toISOString()};if(persist([...books.filter(x=>x.id!==b.id),b])){$('editdialog').close();notify('記録を保存しました。')}};$('title').oninput=()=>$('title').setCustomValidity('');
$('delete').onclick=()=>{if(confirm(`「${editing.title}」の記録を削除しますか？`)&&persist(books.filter(b=>b.id!==editing.id))){$('editdialog').close();notify('記録を削除しました。')}};
$('searchform').onsubmit=async e=>{e.preventDefault();const q=$('query').value.trim();if(!q)return;searchController?.abort();const controller=new AbortController();searchController=controller;const timeout=setTimeout(()=>controller.abort(),15000);$('searchbutton').disabled=true;$('results').replaceChildren();$('searchmessage').textContent='検索しています…';try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=20&printType=books&langRestrict=ja',{signal:controller.signal});if(!r.ok)throw Error();const data=await r.json();const items=data.items||[];$('searchmessage').textContent=items.length?'本を選ぶと記録を入力できます。':'見つかりませんでした。別のキーワードや手動登録をお試しください。';for(const item of items){const v=item.volumeInfo||{},b={id:crypto.randomUUID(),title:v.title||'タイトル不明',author:(v.authors||[]).join('、'),status:'wish',date:'',note:'',cover:(v.imageLinks?.thumbnail||'').replace(/^http:/,'https:')};const button=textNode('button','','result');button.type='button';const info=textNode('span','');info.append(textNode('strong',b.title),textNode('div',[b.author,v.publisher,v.publishedDate].filter(Boolean).join(' / '),'muted'));button.append(coverNode(b.cover),info);button.onclick=()=>openEditor(b);$('results').append(button)}}catch{$('searchmessage').textContent='検索できませんでした。通信状況を確認するか、手動で登録してください。'}finally{clearTimeout(timeout);$('searchbutton').disabled=false}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,books},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='recotte-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('importfile').click();$('importfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error();const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.books)||!data.books.every(validBook))throw Error();const incoming=new Map(data.books.map(b=>[b.id,b]));const collisions=books.some(b=>incoming.has(b.id));if(collisions&&!confirm('同じ記録はバックアップの内容で上書きします。読み込みますか？'))return;if(persist([...books.filter(b=>!incoming.has(b.id)),...incoming.values()]))notify('バックアップを読み込みました。')}catch{notify('読み込めませんでした。Recotte! のバックアップJSONを選んでください。')}finally{e.target.value=''}};
render();
</script></body></html>
